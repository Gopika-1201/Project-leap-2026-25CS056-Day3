
<!DOCTYPE html>
<html>

<head>
    <title>Bank Account Directory</title>
</head>

<body>

    <h2>Bank Account Directory</h2>

    <h3>Add a New Account</h3>

    <form id="account-form">

        <label>Account Number:</label>
        <input type="number" id="accountNumber" required>

        <br><br>

        <label>Account Holder:</label>
        <input type="text" id="accountHolder" required>

        <br><br>

        <label>Balance:</label>
        <input type="number" id="balance" step="0.01" required>

        <br><br>

        <button type="submit">Save Account</button>

    </form>

    <p id="message"></p>

    <h3>Registered Accounts</h3>

    <table border="1">

        <thead>
            <tr>
                <th>Account Number</th>
                <th>Account Holder</th>
                <th>Balance</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="account-table">
        </tbody>

    </table>


    <script>

        function loadBankAccounts() {

            fetch("/accounts")

                .then(response => {

                    if (!response.ok) {
                        throw new Error("GET failed");
                    }

                    return response.json();

                })

                .then(accounts => {

                    let table = document.getElementById("account-table");

                    table.innerHTML = "";

                    accounts.forEach(account => {

                        let row = table.insertRow();

                        row.insertCell(0).innerHTML = account.accountNumber;

                        row.insertCell(1).innerHTML = account.accountHolder;

                        row.insertCell(2).innerHTML = account.balance;

                        let deleteCell = row.insertCell(3);

                        deleteCell.innerHTML =
                            `<button onclick="deleteAccount(${account.accountNumber})">
                                Delete
                            </button>`;

                    });

                })

                .catch(error => {

                    console.log(error);

                    document.getElementById("message").innerHTML =
                        "Cannot connect to server";

                });
        }


        document.getElementById("account-form").addEventListener("submit", function(event) {

            event.preventDefault();

            let accountNumber =
                document.getElementById("accountNumber").value;

            let accountHolder =
                document.getElementById("accountHolder").value;

            let balance =
                document.getElementById("balance").value;


            fetch("/accounts", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    accountNumber: Number(accountNumber),

                    accountHolder: accountHolder,

                    balance: Number(balance)

                })

            })

            .then(response => {

                if (!response.ok) {
                    throw new Error("POST failed");
                }

                return response.json();

            })

            .then(account => {

                document.getElementById("message").innerHTML =
                    "Account details are saved";

                document.getElementById("account-form").reset();

                loadBankAccounts();

            })

            .catch(error => {

                console.log(error);

                document.getElementById("message").innerHTML =
                    "Failed to save account";

            });

        });


        function deleteAccount(accountNumber) {

            fetch("/accounts/" + accountNumber, {

                method: "DELETE"

            })

            .then(response => {

                if (!response.ok) {
                    throw new Error("DELETE failed");
                }

                return response.text();

            })

            .then(message => {

                document.getElementById("message").innerHTML = message;

                loadBankAccounts();

            })

            .catch(error => {

                console.log(error);

                document.getElementById("message").innerHTML =
                    "Failed to delete account";

            });

        }


        loadBankAccounts();

    </script>

</body>

</html>
